<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Planner Premium Thay</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- 🔥 TROQUE PELA URL DA SUA IMAGEM -->
  <link rel="apple-touch-icon" href="URL_DA_SUA_IMAGEM_AQUI">

  <style>

/* ===============================
   🌸 VARIÁVEIS DE TEMA
================================ */

:root{
  --bg: #fff8fc;
  --card: #ffffff;
  --text: #2a2a2a;

  --primary: #ff4fa3;
  --secondary: #fad6e6;
  --accent: #ff8fc7;

  --shadow: rgba(0,0,0,0.08);
}

body.dark{
  --bg: #111111;
  --card: #1c1c1c;
  --text: #f5f5f5;

  --primary: #ff4fa3;
  --secondary: #2a1b22;
  --accent: #ff8fc7;

  --shadow: rgba(0,0,0,0.4);
}

/* ===============================
   🌿 GLOBAL
================================ */

body{
  margin:0;
  font-family:'Poppins', sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.3s ease;
}

.hidden{
  display:none !important;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===============================
   🔐 LOGIN
================================ */

.lock-screen{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(180deg,var(--primary),var(--bg));
}

.lock-box{
  background:var(--card);
  padding:40px 30px;
  border-radius:25px;
  width:85%;
  max-width:350px;
  text-align:center;
  box-shadow:0 20px 40px var(--shadow);
}

.lock-box h1{
  margin-bottom:10px;
  color:var(--accent);
}

.lock-box p{
  margin-bottom:20px;
  font-size:14px;
  opacity:0.7;
}

.lock-box input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #eee;
  margin-bottom:15px;
  font-size:16px;
  text-align:center;
}

.lock-box button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:var(--secondary);
  font-weight:600;
  cursor:pointer;
}

.lock-box button:hover{
  opacity:0.85;
}

/* ===============================
   📌 HEADER
================================ */

.app-header{
  padding:25px 20px 15px;
  background:var(--card);
  box-shadow:0 4px 15px var(--shadow);
  position:sticky;
  top:0;
  z-index:10;
}

.header-content h2{
  margin:0;
  font-size:20px;
  color:var(--accent);
}

.header-content p{
  margin-top:5px;
  font-size:14px;
  opacity:0.7;
}

/* ===============================
   📦 CORPO
================================ */

.app-body{
  flex:1;
  padding:15px;
  padding-bottom:100px;
}

/* ===============================
   🧾 CARDS
================================ */

.card{
  background:var(--card);
  padding:18px;
  border-radius:20px;
  margin-bottom:18px;
  box-shadow:0 8px 25px var(--shadow);
}

.card h3{
  margin-top:0;
  color:var(--accent);
}

/* ===============================
   🔘 BOTÕES
================================ */

button{
  background:var(--secondary);
  border:none;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  font-weight:500;
}

button:hover{
  opacity:0.8;
}

/* ===============================
   🔻 MENU INFERIOR
================================ */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:var(--card);
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -5px 20px var(--shadow);
  border-top-left-radius:25px;
  border-top-right-radius:25px;
}

.bottom-nav button{
  background:none;
  font-size:22px;
  border:none;
  opacity:0.6;
}

.bottom-nav button.active{
  opacity:1;
  transform:scale(1.2);
}

  </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="lockScreen" class="lock-screen">
  <div class="lock-box">
    <h1>Planner Premium Thay</h1>
    <p>Vida Organizada</p>
    <input type="password" id="password" placeholder="Digite sua senha" maxlength="4">
    <button onclick="unlock()">Entrar</button>
  </div>
</div>

<!-- 📱 APP -->
<div id="app" class="app hidden">

  <header class="app-header">
    <div class="header-content">
      <h2 id="headerTitle">Hoje</h2>
      <p id="headerSubtitle"></p>
    </div>
  </header>

  <main class="app-body">

    <section id="homeTab"></section>
    <section id="treinoTab" class="hidden"></section>
    <section id="dietaTab" class="hidden"></section>
    <section id="rotinaTab" class="hidden"></section>
    <section id="belezaTab" class="hidden"></section>
    <section id="calendarioTab" class="hidden"></section>
    <section id="dashboardTab" class="hidden"></section>
    <section id="configTab" class="hidden"></section>

  </main>

  <nav class="bottom-nav">
    <button onclick="showTab('homeTab')">🏠</button>
    <button onclick="showTab('treinoTab')">🏋️‍♀️</button>
    <button onclick="showTab('dietaTab')">🥗</button>
    <button onclick="showTab('rotinaTab')">📋</button>
    <button onclick="showTab('belezaTab')">🧖‍♀️</button>
    <button onclick="showTab('calendarioTab')">📆</button>
    <button onclick="showTab('dashboardTab')">📈</button>
    <button onclick="showTab('configTab')">⚙️</button>
  </nav>

</div>

<script>
function unlock(){
  const pass = document.getElementById("password").value;
  if(pass === "1804"){
    document.getElementById("lockScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  } else {
    alert("Senha incorreta 💗");
  }
}

function showTab(tabId){
  document.querySelectorAll("main section").forEach(sec=>{
    sec.classList.add("hidden");
  });
  document.getElementById(tabId).classList.remove("hidden");
}
</script>

</body>
</html>
